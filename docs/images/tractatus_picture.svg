<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Η θεωρία της εικόνας στο Tractatus: ισομορφισμός κόσμου και γλώσσας">
  <defs>
    <marker id="arr-tp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--mark, #91590a)"/>
    </marker>
  </defs>

  <!-- Left Box: World (State of Affairs) -->
  <rect x="20" y="18" width="265" height="175" rx="5" fill="var(--secondary, #eceeea)" stroke="var(--border, #cdd3cd)" stroke-width="1.5"/>
  <text x="152" y="42" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--foreground, #1c2022)">ΚΟΣΜΟΣ · Κατάσταση πραγμάτων (2.01)</text>
  <text x="152" y="60" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="11.5" fill="var(--muted-foreground, #57605d)">Απλά αντικείμενα σε καθορισμένη σχέση</text>

  <!-- Graph of objects in the world -->
  <line x1="85" y1="115" x2="152" y2="90" stroke="var(--foreground, #1c2022)" stroke-width="2.2"/>
  <line x1="152" y1="90" x2="220" y2="135" stroke="var(--foreground, #1c2022)" stroke-width="2.2"/>
  <line x1="85" y1="115" x2="220" y2="135" stroke="var(--foreground, #1c2022)" stroke-width="2.2"/>
  <circle cx="85" cy="115" r="18" fill="var(--secondary, #eceeea)"/>
  <circle cx="85" cy="115" r="18" fill="var(--mark-soft, rgba(184, 128, 30, 0.12))" stroke="var(--mark, #91590a)" stroke-width="1.8"/>
  <text x="85" y="120" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--mark, #91590a)">Α</text>
  <circle cx="152" cy="90" r="18" fill="var(--secondary, #eceeea)"/>
  <circle cx="152" cy="90" r="18" fill="var(--mark-soft, rgba(184, 128, 30, 0.12))" stroke="var(--mark, #91590a)" stroke-width="1.8"/>
  <text x="152" y="95" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--mark, #91590a)">Β</text>
  <circle cx="220" cy="135" r="18" fill="var(--secondary, #eceeea)"/>
  <circle cx="220" cy="135" r="18" fill="var(--mark-soft, rgba(184, 128, 30, 0.12))" stroke="var(--mark, #91590a)" stroke-width="1.8"/>
  <text x="220" y="140" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--mark, #91590a)">Γ</text>

  <!-- Middle: Shared Logical Form -->
  <text x="380" y="75" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="12.5" font-weight="700" fill="var(--mark, #91590a)">ΚΟΙΝΗ ΛΟΓΙΚΗ ΜΟΡΦΗ</text>
  <text x="380" y="93" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="11.5" fill="var(--muted-foreground, #57605d)">(δείχνεται, δεν λέγεται · 4.121)</text>
  <line x1="295" y1="112" x2="465" y2="112" stroke="var(--mark, #91590a)" stroke-width="1.8" stroke-dasharray="5,4" marker-start="url(#arr-tp)" marker-end="url(#arr-tp)"/>
  <line x1="295" y1="142" x2="465" y2="142" stroke="var(--mark, #91590a)" stroke-width="1.8" stroke-dasharray="5,4" marker-start="url(#arr-tp)" marker-end="url(#arr-tp)"/>
  <text x="380" y="131" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12" font-style="italic" fill="var(--muted-foreground, #57605d)">1-προς-1 αντιστοιχία (3.21)</text>

  <!-- Right Box: Language (Proposition) -->
  <rect x="475" y="18" width="265" height="175" rx="5" fill="var(--secondary, #eceeea)" stroke="var(--border, #cdd3cd)" stroke-width="1.5"/>
  <text x="607" y="42" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--foreground, #1c2022)">ΓΛΩΣΣΑ · Πρόταση ως εικόνα (4.01)</text>
  <text x="607" y="60" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="11.5" fill="var(--muted-foreground, #57605d)">Απλά ονόματα στην ίδια λογική σχέση</text>

  <line x1="540" y1="115" x2="607" y2="90" stroke="var(--foreground, #1c2022)" stroke-width="2.2"/>
  <line x1="607" y1="90" x2="675" y2="135" stroke="var(--foreground, #1c2022)" stroke-width="2.2"/>
  <line x1="540" y1="115" x2="675" y2="135" stroke="var(--foreground, #1c2022)" stroke-width="2.2"/>
  <rect x="522" y="97" width="36" height="36" rx="4" fill="var(--secondary, #eceeea)"/>
  <rect x="522" y="97" width="36" height="36" rx="4" fill="var(--primary-soft, rgba(30, 92, 78, 0.10))" stroke="var(--primary, #1e5c4e)" stroke-width="1.8"/>
  <text x="540" y="120" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="14" font-weight="700" fill="var(--primary, #1e5c4e)">«α»</text>
  <rect x="589" y="72" width="36" height="36" rx="4" fill="var(--secondary, #eceeea)"/>
  <rect x="589" y="72" width="36" height="36" rx="4" fill="var(--primary-soft, rgba(30, 92, 78, 0.10))" stroke="var(--primary, #1e5c4e)" stroke-width="1.8"/>
  <text x="607" y="95" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="14" font-weight="700" fill="var(--primary, #1e5c4e)">«β»</text>
  <rect x="657" y="117" width="36" height="36" rx="4" fill="var(--secondary, #eceeea)"/>
  <rect x="657" y="117" width="36" height="36" rx="4" fill="var(--primary-soft, rgba(30, 92, 78, 0.10))" stroke="var(--primary, #1e5c4e)" stroke-width="1.8"/>
  <text x="675" y="140" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="14" font-weight="700" fill="var(--primary, #1e5c4e)">«γ»</text>

  <!-- Bottom Bar: 4.014 Analogy -->
  <rect x="20" y="210" width="720" height="44" rx="5" fill="var(--mark-soft, rgba(184, 128, 30, 0.12))" stroke="var(--border, #cdd3cd)" stroke-width="1.2"/>
  <text x="380" y="237" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="13" fill="var(--foreground, #1c2022)">
    <tspan font-weight="700" fill="var(--mark, #91590a)">Πρόταση 4.014:</tspan> Μουσική σκέψη  ⟷  Παρτιτούρα (νότες)  ⟷  Ηχητικά κύματα  ⟷  Αυλάκι δίσκου γραμμοφώνου
  </text>
</svg>
