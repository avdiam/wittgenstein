<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="Μηχανισμός προσοχής (Attention) και νευροσυμβολική επαλήθευση (Lean)">
  <defs>
    <marker id="arr-an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--mark, #91590a)"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--primary, #1e5c4e)"/>
    </marker>
  </defs>

  <!-- Left Panel: Transformer Attention (2017) -->
  <rect x="20" y="16" width="355" height="248" rx="5" fill="var(--secondary, #eceeea)" stroke="var(--border, #cdd3cd)" stroke-width="1.5"/>
  <text x="197" y="40" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--foreground, #1c2022)">1. Μηχανισμός Προσοχής (Attention, 2017)</text>
  <text x="197" y="58" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="11.5" fill="var(--muted-foreground, #57605d)">Πώς τα συμφραζόμενα καθορίζουν τη σημασία</text>

  <!-- Sentence A -->
  <rect x="42" y="80" width="90" height="30" rx="4" fill="var(--mark-soft, rgba(184, 128, 30, 0.12))" stroke="var(--mark, #91590a)" stroke-width="1.6"/>
  <text x="87" y="100" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="13" font-weight="700" fill="var(--mark, #91590a)">«τράπεζα»</text>

  <!-- Attention weights (arcs/lines of varying thickness) -->
  <line x1="132" y1="88" x2="207" y2="78" stroke="var(--mark, #91590a)" stroke-width="3.6"/>
  <line x1="132" y1="95" x2="207" y2="108" stroke="var(--mark, #91590a)" stroke-width="1.2" stroke-dasharray="3,3"/>

  <rect x="207" y="64" width="156" height="28" rx="4" fill="var(--primary-soft, rgba(30, 92, 78, 0.10))" stroke="var(--primary, #1e5c4e)" stroke-width="1.2"/>
  <text x="285" y="82" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12" font-weight="600" fill="var(--primary, #1e5c4e)">«έκλεισε τα ταμεία»</text>
  <text x="285" y="114" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="11.5" fill="var(--muted-foreground, #57605d)">→ πιστωτικό ίδρυμα</text>

  <!-- Sentence B -->
  <rect x="42" y="155" width="90" height="30" rx="4" fill="var(--mark-soft, rgba(184, 128, 30, 0.12))" stroke="var(--mark, #91590a)" stroke-width="1.6"/>
  <text x="87" y="175" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="13" font-weight="700" fill="var(--mark, #91590a)">«τράπεζα»</text>

  <line x1="132" y1="163" x2="207" y2="153" stroke="var(--mark, #91590a)" stroke-width="3.6"/>
  <line x1="132" y1="170" x2="207" y2="183" stroke="var(--mark, #91590a)" stroke-width="1.2" stroke-dasharray="3,3"/>

  <rect x="207" y="139" width="156" height="28" rx="4" fill="var(--primary-soft, rgba(30, 92, 78, 0.10))" stroke="var(--primary, #1e5c4e)" stroke-width="1.2"/>
  <text x="285" y="157" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12" font-weight="600" fill="var(--primary, #1e5c4e)">«στρώθηκε για δείπνο»</text>
  <text x="285" y="189" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="11.5" fill="var(--muted-foreground, #57605d)">→ τραπέζι φαγητού</text>

  <text x="197" y="236" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12" font-style="italic" fill="var(--muted-foreground, #57605d)">Το πάχος της γραμμής δείχνει το «βάρος προσοχής»</text>

  <!-- Right Panel: Neuro-symbolic Verification (AlphaProof + Lean) -->
  <rect x="395" y="16" width="345" height="248" rx="5" fill="var(--secondary, #eceeea)" stroke="var(--border, #cdd3cd)" stroke-width="1.5"/>
  <text x="567" y="40" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--foreground, #1c2022)">2. Νευροσυμβολική Επαλήθευση (2024–2026)</text>
  <text x="567" y="58" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="11.5" fill="var(--muted-foreground, #57605d)">Συνδυασμός των δύο παραδόσεων (π.χ. AlphaProof + Lean)</text>

  <!-- Neural Network Box -->
  <rect x="405" y="76" width="325" height="52" rx="5" fill="var(--mark-soft, rgba(184, 128, 30, 0.12))" stroke="var(--mark, #91590a)" stroke-width="1.5"/>
  <text x="567" y="98" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="12.5" font-weight="700" fill="var(--mark, #91590a)">ΝΕΥΡΩΝΙΚΟ ΜΟΝΤΕΛΟ (Μάθηση από χρήση)</text>
  <text x="567" y="116" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="11.5" fill="var(--foreground, #1c2022)">Προτείνει υποψήφια βήματα απόδειξης («διαίσθηση»)</text>

  <!-- Arrows down and up -->
  <line x1="510" y1="130" x2="510" y2="164" stroke="var(--mark, #91590a)" stroke-width="2" marker-end="url(#arr-an)"/>
  <text x="498" y="152" text-anchor="end" font-family="var(--font-sans, sans-serif)" font-size="11" fill="var(--mark, #91590a)">υποψήφιο βήμα</text>

  <line x1="610" y1="166" x2="610" y2="132" stroke="var(--primary, #1e5c4e)" stroke-width="2" marker-end="url(#arr-ok)"/>
  <text x="620" y="152" text-anchor="start" font-family="var(--font-sans, sans-serif)" font-size="11" fill="var(--primary, #1e5c4e)">έγκριση / απόρριψη</text>

  <!-- Symbolic Verifier Box -->
  <rect x="405" y="168" width="325" height="56" rx="5" fill="var(--primary-soft, rgba(30, 92, 78, 0.10))" stroke="var(--primary, #1e5c4e)" stroke-width="1.5"/>
  <text x="567" y="190" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="12.5" font-weight="700" fill="var(--primary, #1e5c4e)">ΤΥΠΙΚΟΣ ΕΠΑΛΗΘΕΥΤΗΣ · Lean (Λογικοί κανόνες)</text>
  <text x="567" y="209" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="11.5" fill="var(--foreground, #1c2022)">Ελέγχει μηχανικά κάθε βήμα · μηδενικές «παραισθήσεις»</text>

  <text x="567" y="246" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12" font-style="italic" fill="var(--muted-foreground, #57605d)">Απόγονος του Frege, των Principia και του Turing</text>
</svg>
