<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Αριστερά ένας τεχνητός νευρώνας: τρεις είσοδοι πολλαπλασιάζονται με τα βάρη τους, αθροίζονται, και ο νευρώνας ανάβει αν το άθροισμα ξεπερνά ένα όριο. Δεξιά ένα μικρό δίκτυο τριών επιπέδων, όπου κάθε γραμμή είναι ένα βάρος">
  <defs>
    <marker id="nn-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--primary, #1e5c4e)"/>
    </marker>
  </defs>

  <!-- Panel titles -->
  <g font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--foreground, #1c2022)" text-anchor="middle">
    <text x="195" y="30">(α) Ένας τεχνητός νευρώνας</text>
    <text x="580" y="30">(β) Ένα μικρό δίκτυο σε επίπεδα</text>
  </g>
  <line x1="400" y1="16" x2="400" y2="290" stroke="var(--border, #cdd3cd)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- (α) Inputs -->
  <g stroke="var(--muted-foreground, #57605d)" stroke-width="1.6">
    <line x1="75" y1="95" x2="217" y2="145"/>
    <line x1="75" y1="150" x2="216" y2="150"/>
    <line x1="75" y1="205" x2="217" y2="155"/>
  </g>
  <g fill="var(--secondary, #eceeea)" stroke="var(--border, #cdd3cd)" stroke-width="1.5">
    <rect x="45" y="80" width="30" height="30" rx="4"/>
    <rect x="45" y="135" width="30" height="30" rx="4"/>
    <rect x="45" y="190" width="30" height="30" rx="4"/>
  </g>
  <g font-family="var(--font-mono, monospace)" font-size="15" fill="var(--foreground, #1c2022)" text-anchor="middle">
    <text x="60" y="100">1</text>
    <text x="60" y="155">1</text>
    <text x="60" y="210">0</text>
  </g>
  <text x="60" y="66" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="12" fill="var(--muted-foreground, #57605d)">είσοδοι</text>

  <!-- (α) Weights on the lines -->
  <g font-family="var(--font-mono, monospace)" font-size="13" font-weight="600" fill="var(--mark, #91590a)" text-anchor="middle">
    <text x="140" y="108">0,8</text>
    <text x="140" y="143">−0,3</text>
    <text x="140" y="203">1,2</text>
  </g>
  <text x="140" y="66" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="12" fill="var(--mark, #91590a)">βάρη</text>

  <!-- (α) The neuron -->
  <circle cx="250" cy="150" r="34" fill="var(--primary-soft, #dfeae5)" stroke="var(--primary, #1e5c4e)" stroke-width="2"/>
  <text x="250" y="158" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="24" fill="var(--primary, #1e5c4e)">Σ</text>
  <text x="250" y="202" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="12" fill="var(--muted-foreground, #57605d)">όριο: 0,4</text>
  <line x1="284" y1="150" x2="326" y2="150" stroke="var(--primary, #1e5c4e)" stroke-width="2" marker-end="url(#nn-arr)"/>
  <text x="332" y="155" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="600" fill="var(--primary, #1e5c4e)">ανάβει</text>

  <!-- (α) The computation -->
  <g font-family="var(--font-mono, monospace)" font-size="12.5" fill="var(--foreground, #1c2022)" text-anchor="middle">
    <text x="195" y="248">1 × 0,8 + 1 × (−0,3) + 0 × 1,2 = 0,5</text>
  </g>
  <text x="195" y="270" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="12.5" fill="var(--foreground, #1c2022)">0,5 &gt; 0,4, άρα ο νευρώνας ανάβει</text>

  <!-- (β) Connections: every node to every node of the next layer -->
  <g stroke="var(--muted-foreground, #57605d)" stroke-width="1" opacity="0.55">
    <line x1="450" y1="100" x2="570" y2="125"/><line x1="450" y1="100" x2="570" y2="175"/><line x1="450" y1="100" x2="570" y2="225"/>
    <line x1="450" y1="150" x2="570" y2="75"/><line x1="450" y1="150" x2="570" y2="125"/><line x1="450" y1="150" x2="570" y2="175"/><line x1="450" y1="150" x2="570" y2="225"/>
    <line x1="450" y1="200" x2="570" y2="75"/><line x1="450" y1="200" x2="570" y2="125"/><line x1="450" y1="200" x2="570" y2="175"/><line x1="450" y1="200" x2="570" y2="225"/>
    <line x1="570" y1="75" x2="690" y2="125"/><line x1="570" y1="75" x2="690" y2="175"/>
    <line x1="570" y1="125" x2="690" y2="125"/><line x1="570" y1="125" x2="690" y2="175"/>
    <line x1="570" y1="175" x2="690" y2="125"/><line x1="570" y1="175" x2="690" y2="175"/>
    <line x1="570" y1="225" x2="690" y2="125"/><line x1="570" y1="225" x2="690" y2="175"/>
  </g>
  <!-- One weight picked out -->
  <line x1="450" y1="100" x2="570" y2="75" stroke="var(--mark, #91590a)" stroke-width="2.6"/>
  <text x="510" y="70" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="12" fill="var(--mark, #91590a)">ένα βάρος</text>

  <!-- (β) Nodes: filled = the neuron fires for this input -->
  <g stroke="var(--primary, #1e5c4e)" stroke-width="1.8">
    <circle cx="450" cy="100" r="13" fill="var(--primary, #1e5c4e)"/>
    <circle cx="450" cy="150" r="13" fill="var(--primary, #1e5c4e)"/>
    <circle cx="450" cy="200" r="13" fill="var(--background, #eff1ee)"/>
    <circle cx="570" cy="75" r="13" fill="var(--primary, #1e5c4e)"/>
    <circle cx="570" cy="125" r="13" fill="var(--background, #eff1ee)"/>
    <circle cx="570" cy="175" r="13" fill="var(--primary, #1e5c4e)"/>
    <circle cx="570" cy="225" r="13" fill="var(--background, #eff1ee)"/>
    <circle cx="690" cy="125" r="13" fill="var(--background, #eff1ee)"/>
    <circle cx="690" cy="175" r="13" fill="var(--primary, #1e5c4e)"/>
  </g>

  <!-- (β) Layer labels -->
  <g font-family="var(--font-sans, sans-serif)" font-size="12" fill="var(--muted-foreground, #57605d)" text-anchor="middle">
    <text x="450" y="262">είσοδος</text>
    <text x="570" y="262">ενδιάμεσο επίπεδο</text>
    <text x="690" y="262">έξοδος</text>
  </g>
  <text x="580" y="286" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12.5" font-style="italic" fill="var(--muted-foreground, #57605d)">Σε ένα γλωσσικό μοντέλο οι γραμμές είναι δισεκατομμύρια</text>
</svg>
