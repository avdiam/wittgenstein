<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" role="img" aria-label="Τα κυκλώματα διακοπτών του Shannon (1938): ΚΑΙ, Ή, ΟΧΙ">
  <!-- Panel 1: Series = AND -->
  <rect x="20" y="16" width="350" height="170" rx="5" fill="var(--secondary, #eceeea)" stroke="var(--border, #cdd3cd)" stroke-width="1.5"/>
  <text x="195" y="36" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--foreground, #1c2022)">1. Διακόπτες σε σειρά = «ΚΑΙ» (p ∧ q)</text>

  <!-- Wire with two switches in series -->
  <circle cx="52" cy="105" r="4" fill="var(--primary, #1e5c4e)"/>
  <line x1="56" y1="105" x2="115" y2="105" stroke="var(--foreground, #1c2022)" stroke-width="2.4"/>
  <!-- Switch p -->
  <circle cx="115" cy="105" r="3.5" fill="var(--foreground, #1c2022)"/>
  <line x1="115" y1="105" x2="152" y2="85" stroke="var(--mark, #91590a)" stroke-width="2.6"/>
  <circle cx="155" cy="105" r="3.5" fill="var(--foreground, #1c2022)"/>
  <text x="135" y="76" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="14" font-weight="700" fill="var(--mark, #91590a)">p</text>

  <line x1="155" y1="105" x2="225" y2="105" stroke="var(--foreground, #1c2022)" stroke-width="2.4"/>
  <!-- Switch q -->
  <circle cx="225" cy="105" r="3.5" fill="var(--foreground, #1c2022)"/>
  <line x1="225" y1="105" x2="262" y2="85" stroke="var(--mark, #91590a)" stroke-width="2.6"/>
  <circle cx="265" cy="105" r="3.5" fill="var(--foreground, #1c2022)"/>
  <text x="245" y="76" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="14" font-weight="700" fill="var(--mark, #91590a)">q</text>

  <line x1="265" y1="105" x2="334" y2="105" stroke="var(--foreground, #1c2022)" stroke-width="2.4"/>
  <circle cx="338" cy="105" r="4" fill="var(--primary, #1e5c4e)"/>

  <text x="195" y="148" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12.5" fill="var(--muted-foreground, #57605d)">Περνά ρεύμα (1) <tspan font-weight="700" fill="var(--foreground, #1c2022)">μόνο αν</tspan> είναι κλειστοί</text>
  <text x="195" y="167" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12.5" fill="var(--muted-foreground, #57605d)">και ο διακόπτης p <tspan font-weight="700" fill="var(--foreground, #1c2022)">και</tspan> ο διακόπτης q (p · q = 1)</text>

  <!-- Panel 2: Parallel = OR -->
  <rect x="390" y="16" width="350" height="170" rx="5" fill="var(--secondary, #eceeea)" stroke="var(--border, #cdd3cd)" stroke-width="1.5"/>
  <text x="565" y="36" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--foreground, #1c2022)">2. Διακόπτες παράλληλα = «Ή» (p ∨ q)</text>

  <!-- Entry wire -->
  <circle cx="425" cy="100" r="4" fill="var(--primary, #1e5c4e)"/>
  <line x1="429" y1="100" x2="480" y2="100" stroke="var(--foreground, #1c2022)" stroke-width="2.4"/>
  <!-- Split up and down -->
  <line x1="480" y1="74" x2="480" y2="126" stroke="var(--foreground, #1c2022)" stroke-width="2.4"/>
  <!-- Top branch (p) -->
  <line x1="480" y1="74" x2="540" y2="74" stroke="var(--foreground, #1c2022)" stroke-width="2.4"/>
  <circle cx="540" cy="74" r="3.5" fill="var(--foreground, #1c2022)"/>
  <line x1="540" y1="74" x2="577" y2="56" stroke="var(--mark, #91590a)" stroke-width="2.6"/>
  <circle cx="580" cy="74" r="3.5" fill="var(--foreground, #1c2022)"/>
  <text x="560" y="52" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="13.5" font-weight="700" fill="var(--mark, #91590a)">p</text>
  <line x1="580" y1="74" x2="640" y2="74" stroke="var(--foreground, #1c2022)" stroke-width="2.4"/>

  <!-- Bottom branch (q) -->
  <line x1="480" y1="126" x2="540" y2="126" stroke="var(--foreground, #1c2022)" stroke-width="2.4"/>
  <circle cx="540" cy="126" r="3.5" fill="var(--foreground, #1c2022)"/>
  <line x1="540" y1="126" x2="577" y2="108" stroke="var(--mark, #91590a)" stroke-width="2.6"/>
  <circle cx="580" cy="126" r="3.5" fill="var(--foreground, #1c2022)"/>
  <text x="560" y="106" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="13.5" font-weight="700" fill="var(--mark, #91590a)">q</text>
  <line x1="580" y1="126" x2="640" y2="126" stroke="var(--foreground, #1c2022)" stroke-width="2.4"/>

  <!-- Rejoin -->
  <line x1="640" y1="74" x2="640" y2="126" stroke="var(--foreground, #1c2022)" stroke-width="2.4"/>
  <line x1="640" y1="100" x2="696" y2="100" stroke="var(--foreground, #1c2022)" stroke-width="2.4"/>
  <circle cx="700" cy="100" r="4" fill="var(--primary, #1e5c4e)"/>

  <text x="565" y="152" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12.5" fill="var(--muted-foreground, #57605d)">Περνά ρεύμα (1) αν είναι κλειστός <tspan font-weight="700" fill="var(--foreground, #1c2022)">έστω ο ένας</tspan></text>
  <text x="565" y="170" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12.5" fill="var(--muted-foreground, #57605d)">από τους δύο διακόπτες p <tspan font-weight="700" fill="var(--foreground, #1c2022)">ή</tspan> q</text>

  <!-- Bottom Banner: Negation & Logic Gates -->
  <rect x="20" y="200" width="720" height="78" rx="5" fill="var(--primary-soft, rgba(30, 92, 78, 0.10))" stroke="var(--border, #cdd3cd)" stroke-width="1.2"/>
  <text x="380" y="225" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--primary, #1e5c4e)">3. Αντίστροφος διακόπτης = «ΟΧΙ» (¬p) · Οι «λογικές πύλες» των σημερινών υπολογιστών</text>
  <text x="380" y="245" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12.5" fill="var(--foreground, #1c2022)">Κάθε πίνακας αληθείας του Tractatus και του Post γίνεται κυριολεκτικά</text>
  <text x="380" y="265" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12.5" fill="var(--foreground, #1c2022)">ένα ηλεκτρονικό κύκλωμα από τρανζίστορ (bits 0 και 1)</text>
</svg>
