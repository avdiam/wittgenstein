<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="Το διαγώνιο επιχείρημα του Cantor">
  <defs>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--mark, #91590a)"/>
    </marker>
  </defs>

  <!-- Left panel: The infinite list -->
  <rect x="20" y="16" width="420" height="248" rx="5" fill="var(--secondary, #eceeea)" stroke="var(--border, #cdd3cd)" stroke-width="1.5"/>
  <text x="230" y="42" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--foreground, #1c2022)">Υποτιθέμενος πλήρης κατάλογος ακολουθιών</text>

  <!-- Diagonal highlight line -->
  <line x1="175" y1="68" x2="325" y2="188" stroke="var(--mark, #91590a)" stroke-width="2" stroke-dasharray="4,3" opacity="0.65"/>

  <!-- Row 1 -->
  <text x="50" y="82" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="600" fill="var(--foreground, #1c2022)">1η σειρά:</text>
  <circle cx="185" cy="77" r="14" fill="var(--mark-soft, rgba(184, 128, 30, 0.12))" stroke="var(--mark, #91590a)" stroke-width="1.8"/>
  <text x="185" y="83" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" font-weight="700" fill="var(--mark, #91590a)">0</text>
  <text x="230" y="83" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">1</text>
  <text x="275" y="83" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">0</text>
  <text x="320" y="83" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">1</text>
  <text x="365" y="83" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">…</text>

  <!-- Row 2 -->
  <text x="50" y="118" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="600" fill="var(--foreground, #1c2022)">2η σειρά:</text>
  <text x="185" y="119" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">1</text>
  <circle cx="230" cy="113" r="14" fill="var(--mark-soft, rgba(184, 128, 30, 0.12))" stroke="var(--mark, #91590a)" stroke-width="1.8"/>
  <text x="230" y="119" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" font-weight="700" fill="var(--mark, #91590a)">1</text>
  <text x="275" y="119" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">0</text>
  <text x="320" y="119" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">0</text>
  <text x="365" y="119" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">…</text>

  <!-- Row 3 -->
  <text x="50" y="154" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="600" fill="var(--foreground, #1c2022)">3η σειρά:</text>
  <text x="185" y="155" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">0</text>
  <text x="230" y="155" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">0</text>
  <circle cx="275" cy="149" r="14" fill="var(--mark-soft, rgba(184, 128, 30, 0.12))" stroke="var(--mark, #91590a)" stroke-width="1.8"/>
  <text x="275" y="155" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" font-weight="700" fill="var(--mark, #91590a)">0</text>
  <text x="320" y="155" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">1</text>
  <text x="365" y="155" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">…</text>

  <!-- Row 4 -->
  <text x="50" y="190" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="600" fill="var(--foreground, #1c2022)">4η σειρά:</text>
  <text x="185" y="191" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">1</text>
  <text x="230" y="191" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">0</text>
  <text x="275" y="191" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">1</text>
  <circle cx="320" cy="185" r="14" fill="var(--mark-soft, rgba(184, 128, 30, 0.12))" stroke="var(--mark, #91590a)" stroke-width="1.8"/>
  <text x="320" y="191" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" font-weight="700" fill="var(--mark, #91590a)">0</text>
  <text x="365" y="191" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="16" fill="var(--muted-foreground, #57605d)">…</text>

  <text x="230" y="238" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12.5" font-style="italic" fill="var(--muted-foreground, #57605d)">Διαγώνιος: 0, 1, 0, 0, … (το n-οστό ψηφίο της n-οστής σειράς)</text>

  <!-- Arrow to Right Panel -->
  <line x1="445" y1="140" x2="478" y2="140" stroke="var(--mark, #91590a)" stroke-width="2.2" marker-end="url(#arr-c)"/>

  <!-- Right Panel: Inverted Sequence -->
  <rect x="485" y="16" width="255" height="248" rx="5" fill="var(--secondary, #eceeea)" stroke="var(--primary, #1e5c4e)" stroke-width="1.6"/>
  <text x="612" y="42" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--primary, #1e5c4e)">Αντιστροφή της διαγωνίου (0 ↔ 1)</text>

  <rect x="510" y="64" width="205" height="44" rx="5" fill="var(--primary-soft, rgba(30, 92, 78, 0.10))" stroke="var(--primary, #1e5c4e)" stroke-width="1.4"/>
  <text x="612" y="92" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="18" font-weight="700" fill="var(--primary, #1e5c4e)">Νέα: 1  0  1  1 …</text>

  <text x="502" y="136" font-family="var(--font-sans, sans-serif)" font-size="12" fill="var(--foreground, #1c2022)">• Διαφέρει από την <tspan font-weight="700">1η</tspan> στο 1ο ψηφίο (1 ≠ 0)</text>
  <text x="502" y="160" font-family="var(--font-sans, sans-serif)" font-size="12" fill="var(--foreground, #1c2022)">• Διαφέρει από τη <tspan font-weight="700">2η</tspan> στο 2ο ψηφίο (0 ≠ 1)</text>
  <text x="502" y="184" font-family="var(--font-sans, sans-serif)" font-size="12" fill="var(--foreground, #1c2022)">• Διαφέρει από την <tspan font-weight="700">3η</tspan> στο 3ο ψηφίο (1 ≠ 0)</text>
  <text x="502" y="208" font-family="var(--font-sans, sans-serif)" font-size="12" fill="var(--foreground, #1c2022)">• Διαφέρει από την <tspan font-weight="700">4η</tspan> στο 4ο ψηφίο (1 ≠ 0)</text>
  <text x="612" y="242" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12.5" font-weight="600" fill="var(--primary, #1e5c4e)">Άρα λείπει από τον κατάλογο</text>
</svg>
