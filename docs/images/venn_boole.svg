<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Οι κλάσεις του Boole σε διάγραμμα Venn: xy τα λευκά πρόβατα, 1 − x τα μη λευκά πράγματα">
  <defs>
    <clipPath id="vb-clip-x"><circle cx="150" cy="140" r="70"/></clipPath>
    <mask id="vb-mask-notx">
      <rect x="400" y="50" width="330" height="180" fill="#fff"/>
      <circle cx="530" cy="140" r="70" fill="#000"/>
    </mask>
  </defs>

  <!-- Panel 1: xy -->
  <text x="195" y="30" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13.5" font-weight="700" fill="var(--foreground, #1c2022)">xy = τα λευκά πρόβατα («και»)</text>
  <rect x="30" y="50" width="330" height="180" rx="4" fill="none" stroke="var(--border, #cdd3cd)" stroke-width="1.5"/>
  <circle cx="230" cy="140" r="70" fill="var(--primary-soft, rgba(30, 92, 78, 0.10))" clip-path="url(#vb-clip-x)"/>
  <circle cx="230" cy="140" r="70" fill="var(--primary, #1e5c4e)" fill-opacity="0.28" clip-path="url(#vb-clip-x)"/>
  <circle cx="150" cy="140" r="70" fill="none" stroke="var(--foreground, #1c2022)" stroke-width="1.8"/>
  <circle cx="230" cy="140" r="70" fill="none" stroke="var(--foreground, #1c2022)" stroke-width="1.8"/>
  <text x="110" y="136" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="15" font-weight="700" fill="var(--mark, #91590a)">x</text>
  <text x="110" y="154" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="11.5" fill="var(--muted-foreground, #57605d)">λευκά</text>
  <text x="270" y="136" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="15" font-weight="700" fill="var(--mark, #91590a)">y</text>
  <text x="270" y="154" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="11.5" fill="var(--muted-foreground, #57605d)">πρόβατα</text>
  <text x="190" y="146" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="15" font-weight="700" fill="var(--primary, #1e5c4e)">xy</text>
  <text x="48" y="72" font-family="var(--font-mono, monospace)" font-size="13" font-weight="700" fill="var(--muted-foreground, #57605d)">1</text>
  <text x="195" y="256" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12.5" fill="var(--muted-foreground, #57605d)">Το ορθογώνιο (1) είναι όλα τα πράγματα για τα οποία μιλάμε.</text>

  <!-- Panel 2: 1 − x -->
  <text x="565" y="30" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13.5" font-weight="700" fill="var(--foreground, #1c2022)">1 − x = τα μη λευκά πράγματα («όχι»)</text>
  <rect x="400" y="50" width="330" height="180" fill="var(--primary, #1e5c4e)" fill-opacity="0.22" mask="url(#vb-mask-notx)"/>
  <rect x="400" y="50" width="330" height="180" rx="4" fill="none" stroke="var(--border, #cdd3cd)" stroke-width="1.5"/>
  <circle cx="530" cy="140" r="70" fill="none" stroke="var(--foreground, #1c2022)" stroke-width="1.8"/>
  <text x="530" y="136" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="15" font-weight="700" fill="var(--mark, #91590a)">x</text>
  <text x="530" y="154" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="11.5" fill="var(--muted-foreground, #57605d)">λευκά</text>
  <text x="668" y="146" text-anchor="middle" font-family="var(--font-mono, monospace)" font-size="15" font-weight="700" fill="var(--primary, #1e5c4e)">1 − x</text>
  <text x="418" y="72" font-family="var(--font-mono, monospace)" font-size="13" font-weight="700" fill="var(--muted-foreground, #57605d)">1</text>
  <text x="565" y="256" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12.5" fill="var(--muted-foreground, #57605d)">Και x(1 − x) = 0: κανένα πράγμα δεν είναι</text>
  <text x="565" y="275" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12.5" fill="var(--muted-foreground, #57605d)">ταυτόχρονα λευκό και μη λευκό.</text>
</svg>
