<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Ο μαθητής της §185: οι ασκήσεις ως το 1.000 ταιριάζουν και με τον κανόνα «πρόσθετε 2» και με τον κανόνα του μαθητή, που μετά το 1.000 συνεχίζει με 1.004, 1.008">
  <defs>
    <marker id="rf-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--foreground, #1c2022)"/>
    </marker>
  </defs>

  <!-- The exercises the pupil was given, up to 1,000 -->
  <text x="225" y="98" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--foreground, #1c2022)">Οι ασκήσεις του μαθητή, ως το 1.000</text>
  <g fill="var(--secondary, #eceeea)" stroke="var(--border, #cdd3cd)" stroke-width="1.5">
    <rect x="24" y="112" width="54" height="36" rx="4"/>
    <rect x="86" y="112" width="54" height="36" rx="4"/>
    <rect x="148" y="112" width="54" height="36" rx="4"/>
    <rect x="210" y="112" width="54" height="36" rx="4"/>
    <rect x="310" y="112" width="54" height="36" rx="4"/>
    <rect x="372" y="112" width="54" height="36" rx="4"/>
  </g>
  <g font-family="var(--font-mono, monospace)" font-size="14" fill="var(--foreground, #1c2022)" text-anchor="middle">
    <text x="51" y="135">2</text>
    <text x="113" y="135">4</text>
    <text x="175" y="135">6</text>
    <text x="237" y="135">8</text>
    <text x="287" y="135">…</text>
    <text x="337" y="135">998</text>
    <text x="399" y="135">1.000</text>
  </g>
  <!-- Bracket: every exercise fits both rules -->
  <path d="M24,158 L24,166 L426,166 L426,158" fill="none" stroke="var(--muted-foreground, #57605d)" stroke-width="1.3"/>
  <text x="225" y="187" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12.5" font-style="italic" fill="var(--muted-foreground, #57605d)">ταιριάζουν και με τους δύο κανόνες</text>

  <!-- The two ways to go on -->
  <line x1="428" y1="124" x2="472" y2="70" stroke="var(--foreground, #1c2022)" stroke-width="1.8" marker-end="url(#rf-arr)"/>
  <line x1="428" y1="136" x2="472" y2="190" stroke="var(--foreground, #1c2022)" stroke-width="1.8" marker-end="url(#rf-arr)"/>

  <!-- Rule A: add 2 -->
  <text x="478" y="32" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--primary, #1e5c4e)">«πρόσθετε 2»</text>
  <g fill="var(--primary-soft, rgba(30, 92, 78, 0.10))" stroke="var(--primary, #1e5c4e)" stroke-width="1.5">
    <rect x="478" y="44" width="54" height="36" rx="4"/>
    <rect x="540" y="44" width="54" height="36" rx="4"/>
    <rect x="602" y="44" width="54" height="36" rx="4"/>
  </g>
  <g font-family="var(--font-mono, monospace)" font-size="14" fill="var(--foreground, #1c2022)" text-anchor="middle">
    <text x="505" y="67">1.002</text>
    <text x="567" y="67">1.004</text>
    <text x="629" y="67">1.006</text>
    <text x="678" y="67">…</text>
  </g>

  <!-- Rule B: the pupil's rule -->
  <g fill="var(--mark-soft, rgba(184, 128, 30, 0.12))" stroke="var(--mark, #91590a)" stroke-width="1.5">
    <rect x="478" y="180" width="54" height="36" rx="4"/>
    <rect x="540" y="180" width="54" height="36" rx="4"/>
    <rect x="602" y="180" width="54" height="36" rx="4"/>
  </g>
  <g font-family="var(--font-mono, monospace)" font-size="14" fill="var(--foreground, #1c2022)" text-anchor="middle">
    <text x="505" y="203">1.004</text>
    <text x="567" y="203">1.008</text>
    <text x="629" y="203">1.012</text>
    <text x="678" y="203">…</text>
  </g>
  <text x="478" y="236" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--mark, #91590a)">«πρόσθετε 2 ως το 1.000,</text>
  <text x="478" y="254" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--mark, #91590a)">4 ως το 2.000, 6 ως το 3.000»</text>
</svg>
