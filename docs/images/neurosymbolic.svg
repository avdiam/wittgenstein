<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 264" role="img" aria-label="Νευροσυμβολική επαλήθευση: ένα νευρωνικό γλωσσικό μοντέλο προτείνει βήματα απόδειξης και ο τυπικός επαληθευτής Lean ελέγχει το καθένα, εγκρίνοντάς το ή απορρίπτοντάς το">
  <defs><marker id="ns-an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="var(--mark, #91590a)"/></marker><marker id="ns-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="var(--primary, #1e5c4e)"/></marker></defs>
  <text x="300.0" y="30.0" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13.5" font-weight="700" fill="var(--foreground, #1c2022)">Νευροσυμβολική επαλήθευση (2024–2026)</text>
  <text x="300.0" y="49.0" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="11.5" fill="var(--muted-foreground, #57605d)">Συνδυασμός των δύο παραδόσεων, για παράδειγμα AlphaProof και Lean</text>
  <rect x="90" y="66" width="420" height="56" rx="5" fill="var(--mark-soft, rgba(184, 128, 30, 0.12))" stroke="var(--mark, #91590a)" stroke-width="1.5"/>
  <text x="300.0" y="89.0" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--mark, #91590a)">Νευρωνικό γλωσσικό μοντέλο</text>
  <text x="300.0" y="109.0" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12" fill="var(--foreground, #1c2022)">Προτείνει υποψήφια βήματα απόδειξης («διαίσθηση»)</text>
  <line x1="240" y1="124" x2="240" y2="160" stroke="var(--mark, #91590a)" stroke-width="2" marker-end="url(#ns-an)"/>
  <text x="228.0" y="146.0" text-anchor="end" font-family="var(--font-sans, sans-serif)" font-size="11.5" fill="var(--mark, #91590a)">υποψήφιο βήμα</text>
  <line x1="360" y1="162" x2="360" y2="126" stroke="var(--primary, #1e5c4e)" stroke-width="2" marker-end="url(#ns-ok)"/>
  <text x="372.0" y="146.0" text-anchor="start" font-family="var(--font-sans, sans-serif)" font-size="11.5" fill="var(--primary, #1e5c4e)">έγκριση ή απόρριψη</text>
  <rect x="90" y="164" width="420" height="56" rx="5" fill="var(--primary-soft, rgba(30, 92, 78, 0.10))" stroke="var(--primary, #1e5c4e)" stroke-width="1.5"/>
  <text x="300.0" y="187.0" text-anchor="middle" font-family="var(--font-sans, sans-serif)" font-size="13" font-weight="700" fill="var(--primary, #1e5c4e)">Τυπικός επαληθευτής: Lean</text>
  <text x="300.0" y="207.0" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12" fill="var(--foreground, #1c2022)">Ελέγχει μηχανικά κάθε βήμα και απορρίπτει κάθε λογικό κενό</text>
  <text x="300.0" y="248.0" text-anchor="middle" font-family="var(--font-serif, serif)" font-size="12" font-style="italic" fill="var(--muted-foreground, #57605d)">Απόγονος της Εννοιογραφίας του Frege και των Principia</text>
</svg>
